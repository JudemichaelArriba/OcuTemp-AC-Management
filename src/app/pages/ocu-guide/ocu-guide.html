<main class="guide-page" aria-labelledby="ocu-guide-page-title">
  <header class="guide-header">
    <div class="guide-header__identity">
      <div class="guide-mark" aria-hidden="true">
        <span class="material-symbols-outlined">mode_cool</span>
        <i></i>
      </div>
      <div>
        <div class="guide-header__eyebrow">
          <span>Facility intelligence</span>
          <span class="guide-header__status"><i aria-hidden="true"></i> Read-only</span>
        </div>
        <h1 id="ocu-guide-page-title">Ocu<span>Guide</span></h1>
        <p>Ask naturally. Facility evidence appears with the answer when it is needed.</p>
      </div>
    </div>
    <button type="button" class="new-conversation-button" (click)="startNewConversation()"
      aria-label="Clear this conversation and start a new chat">
      <span class="material-symbols-outlined" aria-hidden="true">edit_square</span>
      <span>New chat</span>
    </button>
  </header>

  <aside class="read-only-strip" aria-label="OcuGuide safety notice">
    <span class="material-symbols-outlined" aria-hidden="true">verified_user</span>
    <p><strong>Read-only by design.</strong> OcuGuide can inspect approved facility records, but cannot control AC units or change facility data.</p>
    <span class="read-only-strip__mode">Evidence linked</span>
  </aside>

  <section class="conversation-shell" aria-label="OcuGuide chat workspace">
    <app-ocu-guide-conversation />
  </section>
</main>
